# Vouch evaluation question set.
#
# Structure:
#   questions:           healthy tables (>=100 rows) — used for execution accuracy
#   thin_questions:      1–99 rows — execution accuracy reported separately
#   vacuous_questions:   empty or non-discriminating tables — structural validity only
#   cache_pairs:         canonical variance pairs — normalizer/cache test, not accuracy
#   ablation_subset:     ids used for per-repair-pass ablation (26 entries, 24 unique IDs)
#
# Scoring:
#   exec_accuracy        : exact row-set match vs golden_sql, on questions + thin_questions
#   structural_validity  : result.ok == True and result.sql executes, on ALL sets
#   wrong_but_silent     : wrong AND plan not surfaced; computed on questions + thin only
#   wrong_but_visible    : wrong AND plan surfaced;     computed on questions + thin only
#
# `# REVIEW:` flags mark canonical questions whose intended semantics I inferred;
# eyeball these before running the harness.

meta:
  version: 1
  total_questions: 100          # questions + thin + vacuous
  healthy: 65
  thin: 10
  vacuous: 25
  cache_pairs: 12
  ablation_subset: 26

# ============================================================
# HEALTHY — tables with >=100 rows and meaningful result spread
# ============================================================

questions:

  # ---------- counts ----------
  - id: q001
    q: how many devices are there
    expected_intent: count
    golden_sql: "SELECT COUNT(*) AS count FROM devices"
    order_sensitive: false
    source: canonical
    notes: ""

  - id: q002
